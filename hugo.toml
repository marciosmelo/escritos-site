baseURL = "https://escritos.msmelo.blog/"
theme = "hugo-bearblog"
title = "Escritos — saiu do ar"
author = "Marcio Melo"
copyright = "© Marcio Melo"
defaultContentLanguage = "pt-br"
enableRobotsTXT = true
summaryLength = 40

[languages]
  [languages.pt-br]
    locale = "pt-BR"
    label = "Português"
    weight = 1
    title = "Escritos — saiu do ar"
    [languages.pt-br.params]
      description = "Esse canto fechou. A casa literária é msmelo.art.br."

[pagination]
  pagerSize = 20

[permalinks]
  contos = "/contos/:slug/"
  dezesseis = "/historias/dezesseis/:slug/"

[params]
  description = "Esse canto fechou. A casa literária é msmelo.art.br."
  title = "Escritos — saiu do ar"
  authorName = "M. S. Melo"
  homeUrl = "https://msmelo.blog"
  favicon = "images/favicon.png"
  images = ["images/share.png"]
  hideMadeWithLine = false
  enablePostNavigator = true
  dateFormat = "02 Jan 2006"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "friendly"
    lineNos = false
    codeFences = true

[taxonomies]
  tag = "tags"
  category = "categories"
