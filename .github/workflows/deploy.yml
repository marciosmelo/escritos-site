name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.163.3"
          extended: true

      - name: Build
        run: hugo --minify

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 65002 147.93.38.61 >> ~/.ssh/known_hosts

      - name: Backup remoto
        run: |
          ssh -p 65002 u433986376@147.93.38.61 "
            cd ~/domains/escritos.msmelo.blog &&
            if [ -d public_html ]; then
              cp -a public_html public_html_backup_\$(date +%Y%m%d_%H%M%S)
            fi
          "

      - name: Sync public/
        run: |
          rsync -avz --delete \
            -e "ssh -p 65002" \
            public/ \
            u433986376@147.93.38.61:~/domains/escritos.msmelo.blog/public_html/
